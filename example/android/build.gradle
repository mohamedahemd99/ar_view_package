buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {}
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    
    if (project.hasProperty("android")) {
        project.afterEvaluate {
            android {
                configurations.all {
                    resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.20'
                    resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.20'
                    resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.20'
                }
            }
        }
    }
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
